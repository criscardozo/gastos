version: 2
updates:
  # JS workspace (web + rules-tests + root tooling)
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # One PR for the routine minor/patch churn; majors stay separate.
      minor-and-patch:
        update-types:
          - minor
          - patch

  # CI action versions
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 3

  # iOS Swift Package Manager dependencies (Firebase, GoogleSignIn)
  - package-ecosystem: swift
    directory: "/apps/ios"
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
