version: 2
updates:
  # JS workspace (web + rules-tests + root tooling)
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # Leave the declared range alone when it already admits the new release.
    # npm's default is `increase`, which moved the catalog's @types/node from
    # ^24.13.3 to ^24.13.4 — a range that already allowed 24.13.4, so the
    # lockfile would have taken it with no manifest change at all. The catalog
    # is mirrored in kyber's stack.json, so that turned a no-op into a review
    # across three repositories.
    versioning-strategy: increase-if-necessary
    groups:
      # One PR for the routine churn.
      minor-and-patch:
        update-types:
          - minor
          - patch
    ignore:
      # Majors are opt-in. Framework/toolchain jumps (Next, React, TypeScript,
      # ESLint, @types/node) either break the build or need a manual migration
      # — e.g. TypeScript 7 breaks Next's config loader. Bump those by hand.
      - dependency-name: "*"
        update-types:
          - version-update:semver-major

  # CI action versions — majors here are low-risk and worth taking; grouped
  # into a single PR.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      actions:
        patterns:
          - "*"

  # iOS Swift Package Manager dependencies (Firebase, GoogleSignIn)
  # Swift, with a warning attached.
  #
  # There is NO iOS CI — a private repo bills macOS runners at 10x against one
  # free allowance, which this project does not spend — so the green ticks on a
  # Swift PR here are the web's and the rules' checks. They mean "the web still
  # works" and nothing else. A Swift bump is verified by building and running
  # the 143 Swift tests on Cristian's machine, which is where every other iOS
  # thing is verified too.
  #
  # Which makes the noise worth suppressing: a PR that cannot be auto-verified
  # should at least be about code the app actually compiles.
  - package-ecosystem: swift
    directory: "/apps/ios"
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      swift-minor-patch:
        update-types:
          - minor
          - patch
    ignore:
      # Firebase pins GTMSessionFetcher / GTMAppAuth / GoogleAds transitively;
      # bumping their majors independently breaks the resolved graph. Let the
      # Firebase SDK major drive them.
      - dependency-name: "*"
        update-types:
          - version-update:semver-major
      # Analytics and Ads, which this app does not link.
      #
      # It uses FirebaseAuth and FirebaseFirestore only. These TWO packages are
      # in Package.resolved because the firebase-ios-sdk package DECLARES them
      # for FirebaseAnalytics, which is not included — so their code is never
      # compiled into the app, and a PR bumping them moves nothing that runs.
      # One such PR was opened and closed (#23) before this was added.
      #
      # Named the way the SWIFT ecosystem names things: host and path, not the
      # short repo name. The first attempt used the short names, Dependabot
      # matched neither, and it re-opened the same PR (#25) within minutes of
      # the config landing — which is at least a fast way to be told. The names
      # here are copied from the PR body, which prints exactly what it matches:
      #   Updates `github.com/google/googleappmeasurement` from 12.18.0 to …
      #
      # Lower case as the resolved file spells it; Dependabot's own body uses
      # both cases for this one, so both are listed.
      - dependency-name: "github.com/googleads/google-ads-on-device-conversion-ios-sdk"
      - dependency-name: "github.com/google/googleappmeasurement"
      - dependency-name: "github.com/google/GoogleAppMeasurement"
