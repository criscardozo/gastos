name: Backup

# Weekly Firestore backup. The job itself lives in kyber — it was byte-identical
# in two consumers apart from two sentences of comment — and this file is what
# schedules it and hands it the credential. A called workflow's minutes are
# billed to the caller, so this costs exactly what running it here did.
#
# TWO pins point at kyber from this repo and they are not the same thing:
#   - the submodule gitlink decides which SCRIPTS run;
#   - the `uses:` below decides which WORKFLOW runs, and GitHub resolves that
#     from the repository, not from the checked-out submodule.
# Move one and forget the other and a workflow from one commit drives scripts
# from another, with nothing in the output saying so. kyber-pins.test.ts holds
# the two together. The sha here is full and literal on purpose: `@main` or a
# tag would change what runs without a commit in this repo.

on:
  schedule:
    # Thursday morning in Sydney, year-round: 20:00 UTC Wednesday is 06:00
    # Thursday at +10 (AEST) and 07:00 at +11 (AEDT). GitHub cron is UTC and
    # has no timezone, so the offset is baked in here rather than drifting.
    - cron: "0 20 * * 3"
  # Also runnable on demand: Actions tab -> Backup -> Run workflow, or
  # `gh workflow run Backup`.
  workflow_dispatch:

# One backup at a time. A run queued behind another has nothing new to say.
concurrency:
  group: backup
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  dump:
    uses: criscardozo/kyber/.github/workflows/backup.yml@2a732612f79aaeaa509dfbbae924c5a6abd09415
    secrets:
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
