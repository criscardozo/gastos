name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  web:
    name: Web — typecheck, lint, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter web typecheck
      - run: pnpm --filter web lint
      - run: pnpm --filter web test
      - run: pnpm --filter web build

  e2e:
    name: Web — Playwright E2E (emulators)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter web exec playwright install --with-deps chromium
      - name: Start Firebase emulators
        working-directory: firebase/rules-tests
        run: |
          ./node_modules/.bin/firebase emulators:start --only auth,firestore \
            --config ../firebase.json --project demo-gastos-diarios &
          npx wait-on tcp:9099 tcp:8080 --timeout 120000
      - name: Run E2E
        run: pnpm --filter web test:e2e

  rules:
    name: Firestore rules — emulator tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter rules-tests test

  ios:
    name: iOS — build & period-logic tests
    # macOS runners are free for public repos; for a private repo they burn
    # minutes fast — keep this job manual-friendly.
    if: github.event_name == 'pull_request' || github.ref_name == 'main' || github.ref_name == 'master'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        working-directory: apps/ios
        run: xcodegen
      - name: Build & test
        working-directory: apps/ios
        run: |
          # Pick any available iPhone simulator by UDID via simctl —
          # xcodebuild -showdestinations output is not stable across images.
          UDID=$(xcrun simctl list devices available | grep -m1 'iPhone' \
            | grep -oE '[A-F0-9]{8}-[A-F0-9]{4}-[A-F0-9]{4}-[A-F0-9]{4}-[A-F0-9]{12}')
          if [ -z "$UDID" ]; then
            echo "No iPhone simulator available:" >&2
            xcrun simctl list devices >&2
            exit 1
          fi
          xcodebuild test -project GastosDiarios.xcodeproj -scheme GastosDiarios \
            -destination "platform=iOS Simulator,id=$UDID" \
            -only-testing:GastosDiariosTests
