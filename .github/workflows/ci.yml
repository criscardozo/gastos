name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  # The iOS job runs on macOS runners (10x minute multiplier), so it is
  # manual-only to stay well within the free tier. Trigger it from the
  # Actions tab ("Run workflow") or: gh workflow run CI
  workflow_dispatch:

jobs:
  web:
    name: Web — typecheck, lint, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter web typecheck
      - run: pnpm --filter web lint
      - run: pnpm --filter web test
      - run: pnpm --filter web build

  e2e:
    name: Web — Playwright E2E (emulators)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter web exec playwright install --with-deps chromium
      - name: Start Firebase emulators
        working-directory: firebase/rules-tests
        run: |
          ./node_modules/.bin/firebase emulators:start --only auth,firestore \
            --config ../firebase.json --project demo-gastos-diarios &
          npx wait-on tcp:9099 tcp:8080 --timeout 120000
      - name: Run E2E
        run: pnpm --filter web test:e2e

  rules:
    name: Firestore rules — emulator tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter rules-tests test

  ios:
    name: iOS — build & period-logic tests
    # macOS runners bill at a 10x minute multiplier, so this job is manual
    # only (workflow_dispatch) to stay within the free tier — the web/rules
    # jobs below run on Ubuntu (1x). iOS is also verified locally on each
    # change. Run it on demand from the Actions tab or: gh workflow run CI
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        working-directory: apps/ios
        run: xcodegen
      - name: Build & test
        working-directory: apps/ios
        run: |
          # Pick any available iPhone simulator by UDID via simctl —
          # xcodebuild -showdestinations output is not stable across images.
          UDID=$(xcrun simctl list devices available | grep -m1 'iPhone' \
            | grep -oE '[A-F0-9]{8}-[A-F0-9]{4}-[A-F0-9]{4}-[A-F0-9]{4}-[A-F0-9]{12}')
          if [ -z "$UDID" ]; then
            echo "No iPhone simulator available:" >&2
            xcrun simctl list devices >&2
            exit 1
          fi
          xcodebuild test -project GastosDiarios.xcodeproj -scheme GastosDiarios \
            -destination "platform=iOS Simulator,id=$UDID" \
            -only-testing:GastosDiariosTests
