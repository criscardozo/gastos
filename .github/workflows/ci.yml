name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

# Ubuntu only, by design, and the design outlives its arithmetic. While this
# repo is private a macOS runner bills at a 10x minute multiplier; a public one
# bills nothing for standard runners at all. Neither number decides this: there
# is no iOS job here and no iOS workflow anywhere because that app is built and
# tested locally on a simulator before each change lands (see docs/setup.md),
# and adding a non-Linux runner is a thing to ask about, not to conclude from a
# price. Keep it that way — the whole project runs on $0 of infrastructure.

# One run per branch, and the older one is cancelled.
#
# The three jobs below cost about 25 minutes of Linux between them, against an
# allowance of 2,000 a month shared by every repo in the account. Without this,
# pushing twice in a minute pays for both — and the first run became worthless
# the moment the second started. Six pushes in one afternoon spent 7% of the
# month before this was added.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web — typecheck, lint, test, build
    runs-on: ubuntu-latest
    # A hung emulator or a wedged `next start` would otherwise run for the
    # 6-hour default: 360 minutes, 18% of the monthly allowance, for one
    # failure. The longest this job has taken is 10.6 minutes.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          # kyber is a public sibling repo, so the checkout fetches it
          # at the commit this repo recorded, with no credential.
          submodules: true
          # The checkout is shallow and would arrive with no tags at all, which
          # version-agrees.test.ts cannot tell apart from a version nobody
          # tagged — so it would fail here on every release commit and pass
          # nowhere useful.
          fetch-tags: true
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter web typecheck
      - run: pnpm --filter web lint
      - run: pnpm --filter web test
      # The bank-email parser's own suite. It runs here rather than in its own
      # job because it needs nothing but the install that already happened: 25
      # tests over the shapes the bank actually sends. Left out of CI until
      # now, which meant a change to the wording it matches would have surfaced
      # as a charge quietly never arriving.
      - run: pnpm --filter gmail-bank-ingest test
      # Turbopack reuses this between builds; without it every run compiles the
      # whole app from cold. Keyed on the lockfile AND the sources, so a cache
      # is only reused when it can be: restore-keys falls back to the newest
      # cache for the same lockfile, which is still most of the work.
      - uses: actions/cache@v6
        with:
          path: apps/web/.next/cache
          key: ${{ runner.os }}-next-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('apps/web/src/**') }}
          restore-keys: |
            ${{ runner.os }}-next-${{ hashFiles('pnpm-lock.yaml') }}-
            ${{ runner.os }}-next-
      - run: pnpm --filter web build
      # globals.css, Theme.swift and WidgetTheme.swift are GENERATED from
      # design-system/tokens.json.
      # Regenerating must be a no-op: if it is not, someone edited a token in one
      # of the two platforms by hand, which is how the dark warning text ended up
      # under the AA contrast floor on web only. Stronger than comparing text,
      # because it proves the files can be rebuilt rather than that they match.
      # Ubuntu-only — no iOS toolchain needed to rewrite a string.
      - name: Design tokens rebuild both platforms unchanged
        run: |
          python3 design-system/emit.py --write
          git diff --exit-code apps/web/src/app/globals.css apps/ios/Gastos/Design/Theme.swift apps/ios/GastosWidget/WidgetTheme.swift
      - name: Component anatomy is attributable and representative
        run: python3 design-system/emit.py --verify
      # The PWA is how the app stays on the phone, so "does it still start with
      # no network" is a release-blocking question. It needs the PRODUCTION
      # build above (the service worker is not served by `next dev`), which is
      # why it lives in this job and not in the e2e one.
      - name: PWA still installs and starts offline
        run: |
          pnpm --filter web exec playwright install --with-deps chromium
          pnpm --filter web exec next start -p 3112 &
          npx wait-on http://localhost:3112 --timeout 120000
          pnpm verify:pwa

  e2e:
    name: Web — Playwright E2E (emulators)
    runs-on: ubuntu-latest
    # Longest observed: 9.7 minutes.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter web exec playwright install --with-deps chromium
      - name: Start Firebase emulators
        working-directory: firebase/rules-tests
        run: |
          ./node_modules/.bin/firebase emulators:start --only auth,firestore \
            --config ../firebase.json --project demo-gastos-diarios &
          # These two come from firebase/firebase.json and are checked against
          # it by apps/web/src/lib/emulator-ports.test.ts. Waiting on the wrong
          # pair does not fail fast — it waits the full two minutes and then
          # says "Timed out", which is what a slow emulator looks like.
          npx wait-on tcp:9390 tcp:8390 --timeout 120000
      - name: Run E2E
        run: pnpm --filter web test:e2e

  rules:
    name: Firestore rules — emulator tests
    runs-on: ubuntu-latest
    # Longest observed: 4.6 minutes.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          # kyber is a public sibling repo, so the checkout fetches it
          # at the commit this repo recorded, with no credential.
          submodules: true
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter rules-tests test
