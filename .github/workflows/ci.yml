name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

# Ubuntu only, by design. macOS runners bill at a 10x minute multiplier, so
# there is no iOS job here and no iOS workflow anywhere: that app is built and
# tested locally on a simulator before each change lands (see docs/setup.md).
# Keep it that way — the whole project runs on $0 of infrastructure.

jobs:
  web:
    name: Web — typecheck, lint, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter web typecheck
      - run: pnpm --filter web lint
      - run: pnpm --filter web test
      - run: pnpm --filter web build
      # globals.css and Theme.swift are GENERATED from design-system/tokens.json.
      # Regenerating must be a no-op: if it is not, someone edited a token in one
      # of the two platforms by hand, which is how the dark warning text ended up
      # under the AA contrast floor on web only. Stronger than comparing text,
      # because it proves the files can be rebuilt rather than that they match.
      # Ubuntu-only — no iOS toolchain needed to rewrite a string.
      - name: Design tokens rebuild both platforms unchanged
        run: |
          python3 design-system/emit.py --write
          git diff --exit-code apps/web/src/app/globals.css apps/ios/GastosDiarios/Design/Theme.swift
      - name: Component anatomy is attributable and representative
        run: python3 design-system/emit.py --verify

  e2e:
    name: Web — Playwright E2E (emulators)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter web exec playwright install --with-deps chromium
      - name: Start Firebase emulators
        working-directory: firebase/rules-tests
        run: |
          ./node_modules/.bin/firebase emulators:start --only auth,firestore \
            --config ../firebase.json --project demo-gastos-diarios &
          npx wait-on tcp:9099 tcp:8080 --timeout 120000
      - name: Run E2E
        run: pnpm --filter web test:e2e

  rules:
    name: Firestore rules — emulator tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter rules-tests test
