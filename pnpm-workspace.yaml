packages:
  - apps/web
  - firebase/rules-tests
  - tools/gmail-bank-ingest

# One version per shared tool, referenced as `catalog:` from every workspace.
# The three workspaces had already drifted in what they DECLARED (vitest as
# ^4.0.0 here and ^4.1.10 there) even while pnpm happened to resolve them to
# the same build — and the Stock app, which shares this stack, drifted far
# enough that its rules were being tested with a different TypeScript than its
# app compiled with. This is the cheap way to make that impossible rather than
# unlikely.
catalog:
  vitest: ^4.1.11
  # Held at 12.17.1 for two days: pnpm's release-age quarantine — a
  # supply-chain guard — refused 12.18.0 as too freshly published, and taking
  # it then meant writing 45 bypass entries into this file. Dependabot brought
  # it in once the quarantine let go, with no bypass. Same rule next time.
  firebase: ^12.18.0
  typescript: ^5.9.3
  '@types/node': ^24.13.3
allowBuilds:
  '@firebase/util': true
  '@parcel/watcher': true
  '@swc/core': true
  core-js: false
  esbuild: true
  protobufjs: true
  re2: true
  sharp: true
  unrs-resolver: true

# Force a patched postcss into Next's transitive tree (Next still pins an
# affected 8.5.x). Build-time only — kept until Next ships the bump itself.
overrides:
  postcss: ^8.5.18

