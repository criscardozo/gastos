packages:
  - apps/web
  - firebase/rules-tests
allowBuilds:
  '@firebase/util': true
  '@parcel/watcher': true
  '@swc/core': true
  core-js: false
  esbuild: true
  protobufjs: true
  re2: true
  sharp: true
  unrs-resolver: true

# Force a patched postcss into Next's transitive tree (Next still pins an
# affected 8.5.x). Build-time only — kept until Next ships the bump itself.
overrides:
  postcss: ^8.5.18
