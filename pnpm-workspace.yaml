packages:
  - apps/web
  - firebase/rules-tests
  - tools/gmail-bank-ingest

# One version per shared tool, referenced as `catalog:` from every workspace.
# The three workspaces had already drifted in what they DECLARED (vitest as
# ^4.0.0 here and ^4.1.10 there) even while pnpm happened to resolve them to
# the same build — and the Stock app, which shares this stack, drifted far
# enough that its rules were being tested with a different TypeScript than its
# app compiled with. This is the cheap way to make that impossible rather than
# unlikely.
catalog:
  vitest: ^4.1.11
  # Held at 12.17.1 for two days: pnpm's release-age quarantine — a
  # supply-chain guard — refused 12.18.0 as too freshly published, and taking
  # it then meant writing 45 bypass entries into this file. Dependabot brought
  # it in once the quarantine let go, with no bypass. Same rule next time.
  firebase: ^12.18.0
  # NOT 7.x, and the reason is not caution. TypeScript 7.0.2 passes typecheck,
  # the 257 web tests and the production build on this codebase — but
  # `typescript-eslint@8` peers on `typescript >=4.8.4 <6.1.0`, so
  # `eslint-config-next` fails to LOAD and `pnpm lint` exits 2. Lint is one of
  # the four checks this project runs, so that is a broken pipeline, not a
  # warning. Revisit when eslint-config-next ships a typescript-eslint that
  # knows about 7.
  typescript: ^5.9.3
  # Pinned to the runtime's major, not to "latest". Node here is v24, and
  # @types/node 26 would describe APIs this Node does not have — the types
  # would compile and the program would not. `pnpm outdated` calls this stale;
  # it is aligned. Move it when the Node version moves.
  '@types/node': ^24.13.3
allowBuilds:
  '@firebase/util': true
  '@parcel/watcher': true
  '@swc/core': true
  core-js: false
  esbuild: true
  protobufjs: true
  re2: true
  sharp: true
  unrs-resolver: true

# Force a patched postcss into Next's transitive tree (Next still pins an
# affected 8.5.x). Build-time only — kept until Next ships the bump itself.
overrides:
  postcss: ^8.5.18
  # jspdf 4.2.1 (latest) pins dompurify 3.4.12, and <=3.4.12 has an XSS:
  # removing an IN_PLACE hook leaves a detached subtree executable
  # (GHSA-55q2-fjhq-7xh7). A patch bump upstream of a patch release, so the
  # API is unchanged; dropped once jspdf ships it itself.
  dompurify: ^3.4.14
  # All dev-only, and all reached through firebase-tools / firebase-admin,
  # which pin them transitively. Each is a patch or minor inside the same
  # major, so the API is unchanged and the override goes away the moment the
  # parent ships it itself.
  #   fast-uri <3.1.6: SSRF and host confusion through IPv6 and percent-encoding
  #     normalisation (4 advisories, all high).
  #   qs <6.16.0: array-limit bypass, and a DoS through an attacker-controlled
  #     isBuffer.
  #   fast-xml-parser <5.10.1: repeated DOCTYPE declarations reset the entity
  #     expansion limit.
  fast-uri: ^3.1.6
  qs: ^6.16.0
  fast-xml-parser: ^5.10.1
  # The ONE that reaches the browser: exceljs 4.4.0 pins uuid 8.3.2, which is
  # missing a buffer bounds check in v3/v5/v6 when `buf` is passed. exceljs
  # does `const {v4} = require('uuid')` and calls it with no arguments, so the
  # vulnerable path is unreachable here — this is scoped to exceljs rather
  # than global on purpose: firebase-admin and firebase-tools resolve their
  # own uuid, and dragging their trees across three majors to silence an alert
  # about code nobody runs would be the more dangerous change.
  exceljs>uuid: ^11.1.1

