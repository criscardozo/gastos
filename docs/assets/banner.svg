<svg xmlns="http://www.w3.org/2000/svg" width="744" height="256" viewBox="0 0 744 256">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FF5C39"/>
      <stop offset="1" stop-color="#E8492A"/>
    </linearGradient>
  </defs>
  <rect width="743.984" height="256" rx="51" fill="url(#bg)"/>
  <g transform="translate(-384.00 -384.00)">  <g transform="translate(379.63 391.82) scale(2.6212)">
    <!-- tail: an open curl, stroked so it reads at 40px -->
    <path d="M18 54 a6 6 0 1 1 -1.5 -9.5" fill="none" stroke="#FAF6EF"
          stroke-width="4.2" stroke-linecap="round"/>
    <!-- legs -->
    <rect x="29" y="70" width="10" height="14" rx="5" fill="#FAF6EF"/>
    <rect x="55" y="70" width="10" height="14" rx="5" fill="#FAF6EF"/>
    <!-- ear, behind the body -->
    <path d="M54 33.5 Q58 21.5 67 24.5 Q71.5 27.5 64.5 36 Z" fill="#FAF6EF"/>
    <!-- body -->
    <ellipse cx="47" cy="56" rx="31" ry="25" fill="#FAF6EF"/>
    <!-- snout: wider than tall and clear of the body, with the nostrils side
         by side on the part that protrudes. Stacked vertically on a vertical
         capsule (as it was) reads as a power socket, not a muzzle. -->
    <rect x="70" y="47.5" width="20" height="17" rx="8.5" fill="#FAF6EF"/>
    <circle cx="81" cy="56" r="2.3" fill="#FF5C39"/>
    <circle cx="86.5" cy="56" r="2.3" fill="#FF5C39"/>
    <!-- eye -->
    <circle cx="60.5" cy="49" r="3" fill="#FF5C39"/>
    <!-- coin slot: sits ON the back, fully inside the body silhouette -->
    <rect x="36" y="34" width="15" height="4.6" rx="2.3" fill="#FF5C39"/>
    <!-- the coin going in -->
    <circle cx="43" cy="16.5" r="8.8" fill="#FAF6EF"/>
    <rect x="41.2" y="11.8" width="3.6" height="9.4" rx="1.8" fill="#FF5C39"/>
  </g></g>
