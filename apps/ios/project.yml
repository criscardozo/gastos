name: GastosDiarios
options:
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: es
  createIntermediateGroups: true
  groupSortPosition: top

packages:
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    from: 11.0.0
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS
    from: 8.0.0

settings:
  base:
    SWIFT_VERSION: "5.10"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    ENABLE_USER_SCRIPT_SANDBOXING: "NO"
    CODE_SIGN_STYLE: Automatic

targets:
  GastosDiarios:
    type: application
    platform: iOS
    sources:
      - path: GastosDiarios
      # Shared cross-platform contract: seed categories (icon + color source of truth).
      - path: ../../shared/categories.json
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.cardozo.gastosdiarios
        PRODUCT_NAME: GastosDiarios
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        OTHER_LDFLAGS: -ObjC
    info:
      path: GastosDiarios/Info.plist
      properties:
        CFBundleDisplayName: Gastos Diarios
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen:
          UIColorName: ""
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIAppFonts:
          - Outfit-Variable.ttf
        # Google Sign-In configuration — must match CLIENT_ID /
        # REVERSED_CLIENT_ID in Resources/GoogleService-Info.plist.
        GIDClientID: 56331687585-20fpk74r9r9ta8fuf5c1e88rnedc6qk8.apps.googleusercontent.com
        CFBundleURLTypes:
          - CFBundleTypeRole: Editor
            CFBundleURLSchemes:
              - com.googleusercontent.apps.56331687585-20fpk74r9r9ta8fuf5c1e88rnedc6qk8
          # Deep link into quick entry (gastosdiarios://nuevo) — usable from
          # a plain "Open URL" Shortcut as a Back Tap alternative.
          - CFBundleTypeRole: Editor
            CFBundleURLSchemes:
              - gastosdiarios
    dependencies:
      - package: Firebase
        product: FirebaseAuth
      - package: Firebase
        product: FirebaseFirestore
      - package: GoogleSignIn
        product: GoogleSignIn
      - package: GoogleSignIn
        product: GoogleSignInSwift

  GastosDiariosTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: GastosDiariosTests
      # Shared cross-platform period-logic test vectors (Swift + TS must both pass).
      - path: ../../shared/period-test-vectors.json
        buildPhase: resources
    settings:
      base:
        # Test bundles have no Info.plist of their own; codesigning requires one.
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: dev.cardozo.gastosdiarios.tests
    dependencies:
      - target: GastosDiarios

schemes:
  GastosDiarios:
    build:
      targets:
        GastosDiarios: all
        GastosDiariosTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: false
      targets:
        - GastosDiariosTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
