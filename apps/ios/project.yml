name: Gastos
options:
  # The floor follows the household's phones, not compatibility: this app
  # runs on exactly two iPhones, so a lower floor buys nothing and costs the
  # newer APIs. Cristian's call. Raised to 27.0 on 2026-09-25 once BOTH phones
  # were confirmed on 27 — checked with him, not inferred from the one that is
  # plugged in. Raise it again the same way: when both phones have moved.
  #
  # Declared ONCE, here. It used to be declared twice, also as
  # IPHONEOS_DEPLOYMENT_TARGET under settings.base, and measured on the
  # regenerated project that one WINS: with both present, lowering this line
  # changed nothing. Without it, this line alone sets every configuration —
  # the app, the widget and the tests inherit it — so the second copy was
  # redundant and the misleading one. Removed rather than guarded. The watchOS
  # target is separate (10.0, below) and does not follow: the watch is its own
  # device and nothing there needs a newer floor.
  deploymentTarget:
    iOS: "27.0"
  developmentLanguage: es
  createIntermediateGroups: true
  groupSortPosition: top

packages:
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    # 12.x, the same major the web's JS SDK is on. Two clients talking to one
    # Firestore is a good reason to keep them on the same generation.
    #
    # This was reverted once, and the note that replaced it blamed two things
    # that turned out not to be the cause — gRPC keepalive (reproduced with
    # zero GOAWAYs) and listener churn (the GOAWAY fired before any per-screen
    # store existed). What actually broke it was the seeder: DevSeed.swift ran
    # INSIDE the app at launch and deleted-then-recreated ten documents on the
    # very collections Servicios and Tarjetas then listened to, and on 12.x
    # those listeners never delivered again.
    #
    # Seeding moved out of the app (scripts/seed-emulator.mjs, finishes before
    # launch) and both screens render on 12.18.0 — statement, four charges, the
    # five peso lines, and the three service states. Verified by running it, not
    # by compiling: the 91 Swift tests compile Core/ without Firebase and would
    # pass either way.
    from: 12.0.0
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS
    # Moves with Firebase: the two share a dependency graph, so pinning them to
    # different generations would leave an untested pair.
    from: 9.0.0

settings:
  base:
    SWIFT_VERSION: "5.10"
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_USER_SCRIPT_SANDBOXING: "NO"
    CODE_SIGN_STYLE: Automatic
    # Cristian's free personal team — baked in here so xcodegen persists it
    # and Xcode stops re-writing the generated project on every open. CI
    # builds with CODE_SIGNING_ALLOWED=NO, so this only affects device signing.
    DEVELOPMENT_TEAM: FA737M2U79

targets:
  Gastos:
    type: application
    platform: iOS
    sources:
      - path: Gastos
      # Shared cross-platform contract: seed categories (icon + color source of truth).
      - path: ../../shared/categories.json
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.cardozo.gastos
        PRODUCT_NAME: Gastos
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: "1.2.1"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        OTHER_LDFLAGS: -ObjC
        # The Apps Script web app that runs the Gmail ingestion on demand.
        #
        # In the repo for the same reason GIDClientID below is: it is not a
        # secret. The endpoint does no work without a request stamped on the
        # household in the last two minutes, which only a member can write —
        # the security is that stamp, not this URL being hard to find. Keeping
        # it here means every build has the button; passing it per build would
        # make it vanish silently the first time somebody forgot.
        GD_INGEST_URL: https://script.google.com/macros/s/AKfycbxq9Vn_eMC_fLdLV4itZFL0ABHr0BdMZCzZeOyA68vECKBawpVIHcikn48tdpHan4h9mw/exec
    info:
      path: Gastos/Info.plist
      properties:
        CFBundleDisplayName: Gastos
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen:
          UIColorName: ""
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIAppFonts:
          - Outfit-Variable.ttf
        # Google Sign-In configuration — must match CLIENT_ID /
        # REVERSED_CLIENT_ID in Resources/GoogleService-Info.plist.
        # Copied from CLIENT_ID in Resources/GoogleService-Info.plist, and it
        # must be re-copied whenever a new iOS app is registered in Firebase:
        # a new app gets a NEW OAuth client, so swapping only the plist leaves
        # sign-in refused with no hint as to why.
        #
        # That last sentence said "Checked by GastosTests" for as long as it
        # existed and no test in that bundle ever named this value — a comment
        # asserting a guard into being. The guard is real now and is
        # apps/web/src/lib/oauth-scheme.test.ts, which runs on every push: it
        # reads REVERSED_CLIENT_ID out of GoogleService-Info.plist and requires
        # both this file and the generated Info.plist to carry it. It is over
        # there rather than in GastosTests because it needs no simulator.
        GIDClientID: 56331687585-o1vn25s25vv682tgqc34uq03hucklc89.apps.googleusercontent.com
        # The Apps Script web app that runs the Gmail ingestion on demand.
        # Empty until it is deployed (docs/setup.md) — with no URL the "traer
        # ahora" button is not shown at all rather than shown broken. Not a
        # secret: the endpoint does nothing without a fresh request stamped on
        # the household, which only a member can write.
        GDIngestURL: $(GD_INGEST_URL)
        # No LSApplicationQueriesSchemes: it existed only so `canOpenURL` could
        # be asked about Wallet's `shoebox` scheme, and that call is deprecated
        # from iOS 27. The entry form now just opens the URL and hides the
        # button if it fails — `open` needs no declaration. See ExpenseFormView.
        CFBundleURLTypes:
          - CFBundleTypeRole: Editor
            CFBundleURLSchemes:
              - com.googleusercontent.apps.56331687585-o1vn25s25vv682tgqc34uq03hucklc89
          # Deep link into quick entry (gastos://nuevo) — usable from
          # a plain "Open URL" Shortcut as a Back Tap alternative.
          - CFBundleTypeRole: Editor
            CFBundleURLSchemes:
              - gastos
    # App group shared with the widget extension (budget snapshot handoff).
    # NOTE: minimal on purpose — free personal team signing.
    entitlements:
      path: Gastos/Gastos.entitlements
      properties:
        com.apple.security.application-groups:
          - group.dev.cardozo.gastos
    dependencies:
      - package: Firebase
        product: FirebaseAuth
      - package: Firebase
        product: FirebaseFirestore
      - package: GoogleSignIn
        product: GoogleSignIn
      - package: GoogleSignIn
        product: GoogleSignInSwift
      - target: GastosWidget
      # Embeds the watchOS app so it installs alongside the phone app.
      - target: GastosWatch
        embed: true

  GastosWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: GastosWidget
      # The quick-entry App Intent is compiled into BOTH targets so the
      # iOS 18 Control can launch it (WIDGET_EXTENSION conditionals inside).
      - path: Gastos/App/QuickEntryIntent.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.cardozo.gastos.widget
        PRODUCT_NAME: GastosWidget
        MARKETING_VERSION: "1.2.1"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        SKIP_INSTALL: YES
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) WIDGET_EXTENSION"
    info:
      path: GastosWidget/Info.plist
      properties:
        CFBundleDisplayName: Gastos
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: GastosWidget/GastosWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.dev.cardozo.gastos

  # watchOS companion — a minimal quick-entry relay. It CANNOT sign in with
  # Google (no browser on the watch), so it never talks to Firebase: it sends
  # the expense to the phone via WatchConnectivity and the (authenticated)
  # phone performs the Firestore write. No Firebase dependency here on purpose.
  GastosWatch:
    type: application
    platform: watchOS
    deploymentTarget: "10.0"
    sources:
      - path: GastosWatch
      # Same shared seed categories bundled as a resource and decoded on-watch.
      - path: ../../shared/categories.json
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.cardozo.gastos.watchkitapp
        PRODUCT_NAME: GastosWatch
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: "1.2.1"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "4"
        SKIP_INSTALL: YES
        GENERATE_INFOPLIST_FILE: NO
    info:
      path: GastosWatch/Info.plist
      properties:
        CFBundleDisplayName: Gastos
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # Modern single-target watchOS app paired to the iOS app.
        WKApplication: true
        WKCompanionAppBundleIdentifier: dev.cardozo.gastos

  # Compiles Core/ DIRECTLY instead of depending on the app target.
  #
  # The app embeds the watchOS app, so depending on it made `xcodebuild test`
  # require the watchOS platform to be installed — and when Xcode updated to
  # 26.6 that platform went missing and the whole test loop stopped for a
  # multi-gigabyte download. A unit test about parsing "90,12" has no business
  # needing a watch SDK.
  #
  # The cost is that a test touching something outside this list fails to
  # compile rather than failing an assertion. That is the trade: the list below
  # is the domain, and the domain is what these tests are about. Anything that
  # needs the app (SwiftUI views, AppModel) belongs in the app scheme.
  GastosTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: GastosTests
      - path: Gastos/Core
      - path: Gastos/Services/SigningExpiryService.swift
      # Composing one Text out of differently styled runs. In Design/ rather
      # than Core/ because it imports SwiftUI, and Core is deliberately free of
      # it — so it is listed here by name instead of arriving with a folder.
      - path: Gastos/Design/RichText.swift
      # AppFont's size→text-style mapping and its Dynamic Type scaling. In the
      # app target's Design/ rather than Core/ because it imports SwiftUI, so
      # it is listed by name like RichText above.
      - path: Gastos/Design/Theme.swift
      # The strings L10n looks up. Compiled into the TEST bundle, which is why
      # L10n resolves its bundle through a type in its own module rather than
      # assuming Bundle.main.
      - path: Gastos/Resources/Localizable.xcstrings
        buildPhase: resources
      # SeedCategories decodes this at runtime.
      - path: ../../shared/categories.json
        buildPhase: resources
      # The real font, so the scaling tests measure the path the app actually
      # takes (`.custom(_:relativeTo:)`) with the face it actually renders.
      # A test bundle has no UIAppFonts, so the tests register it at runtime;
      # without it `AppFont.available` is false here and every scaling test
      # silently measures the FALLBACK instead.
      - path: Gastos/Resources/Fonts/Outfit-Variable.ttf
        buildPhase: resources
      # Shared cross-platform test vectors (Swift + TS must both pass).
      - path: ../../shared/period-test-vectors.json
        buildPhase: resources
      - path: ../../shared/bank-match-vectors.json
      - path: ../../shared/recurring-vectors.json
      - path: ../../shared/service-name-vectors.json
        buildPhase: resources
    settings:
      base:
        # Test bundles have no Info.plist of their own; codesigning requires one.
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: dev.cardozo.gastos.tests
    dependencies:
      # Models.swift uses @DocumentID / @ServerTimestamp.
      - package: Firebase
        product: FirebaseFirestore

schemes:
  Gastos:
    build:
      targets:
        Gastos: all
        GastosTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: false
      targets:
        - GastosTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
  # Tests on their own, so the loop does not need the watchOS platform just
  # because the app scheme embeds a watch app. Use this one to run tests; the
  # Gastos scheme is for running the app.
  GastosTests:
    build:
      targets:
        GastosTests: [test]
    test:
      config: Debug
      gatherCoverageData: false
      targets:
        - GastosTests
  GastosWatch:
    build:
      targets:
        GastosWatch: all
    run:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
