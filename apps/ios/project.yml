name: GastosDiarios
options:
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: es
  createIntermediateGroups: true
  groupSortPosition: top

packages:
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    # 12.x, the same major the web's JS SDK is on. Two clients talking to one
    # Firestore is a good reason to keep them on the same generation.
    #
    # This was reverted once, and the note that replaced it blamed two things
    # that turned out not to be the cause — gRPC keepalive (reproduced with
    # zero GOAWAYs) and listener churn (the GOAWAY fired before any per-screen
    # store existed). What actually broke it was the seeder: DevSeed.swift ran
    # INSIDE the app at launch and deleted-then-recreated ten documents on the
    # very collections Servicios and Tarjetas then listened to, and on 12.x
    # those listeners never delivered again.
    #
    # Seeding moved out of the app (scripts/seed-emulator.mjs, finishes before
    # launch) and both screens render on 12.18.0 — statement, four charges, the
    # five peso lines, and the three service states. Verified by running it, not
    # by compiling: the 91 Swift tests compile Core/ without Firebase and would
    # pass either way.
    from: 12.0.0
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS
    # Moves with Firebase: the two share a dependency graph, so pinning them to
    # different generations would leave an untested pair.
    from: 9.0.0

settings:
  base:
    SWIFT_VERSION: "5.10"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    ENABLE_USER_SCRIPT_SANDBOXING: "NO"
    CODE_SIGN_STYLE: Automatic
    # Cristian's free personal team — baked in here so xcodegen persists it
    # and Xcode stops re-writing the generated project on every open. CI
    # builds with CODE_SIGNING_ALLOWED=NO, so this only affects device signing.
    DEVELOPMENT_TEAM: FA737M2U79

targets:
  GastosDiarios:
    type: application
    platform: iOS
    sources:
      - path: GastosDiarios
      # Shared cross-platform contract: seed categories (icon + color source of truth).
      - path: ../../shared/categories.json
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.cardozo.gastosdiarios
        PRODUCT_NAME: GastosDiarios
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        OTHER_LDFLAGS: -ObjC
        # The Apps Script web app that runs the Gmail ingestion on demand.
        #
        # In the repo for the same reason GIDClientID below is: it is not a
        # secret. The endpoint does no work without a request stamped on the
        # household in the last two minutes, which only a member can write —
        # the security is that stamp, not this URL being hard to find. Keeping
        # it here means every build has the button; passing it per build would
        # make it vanish silently the first time somebody forgot.
        GD_INGEST_URL: https://script.google.com/macros/s/AKfycbxq9Vn_eMC_fLdLV4itZFL0ABHr0BdMZCzZeOyA68vECKBawpVIHcikn48tdpHan4h9mw/exec
    info:
      path: GastosDiarios/Info.plist
      properties:
        CFBundleDisplayName: Gastos Diarios
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen:
          UIColorName: ""
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIAppFonts:
          - Outfit-Variable.ttf
        # Google Sign-In configuration — must match CLIENT_ID /
        # REVERSED_CLIENT_ID in Resources/GoogleService-Info.plist.
        GIDClientID: 56331687585-20fpk74r9r9ta8fuf5c1e88rnedc6qk8.apps.googleusercontent.com
        # The Apps Script web app that runs the Gmail ingestion on demand.
        # Empty until it is deployed (docs/setup.md) — with no URL the "traer
        # ahora" button is not shown at all rather than shown broken. Not a
        # secret: the endpoint does nothing without a fresh request stamped on
        # the household, which only a member can write.
        GDIngestURL: $(GD_INGEST_URL)
        CFBundleURLTypes:
          - CFBundleTypeRole: Editor
            CFBundleURLSchemes:
              - com.googleusercontent.apps.56331687585-20fpk74r9r9ta8fuf5c1e88rnedc6qk8
          # Deep link into quick entry (gastosdiarios://nuevo) — usable from
          # a plain "Open URL" Shortcut as a Back Tap alternative.
          - CFBundleTypeRole: Editor
            CFBundleURLSchemes:
              - gastosdiarios
    # App group shared with the widget extension (budget snapshot handoff).
    # NOTE: minimal on purpose — free personal team signing.
    entitlements:
      path: GastosDiarios/GastosDiarios.entitlements
      properties:
        com.apple.security.application-groups:
          - group.dev.cardozo.gastosdiarios
    dependencies:
      - package: Firebase
        product: FirebaseAuth
      - package: Firebase
        product: FirebaseFirestore
      - package: GoogleSignIn
        product: GoogleSignIn
      - package: GoogleSignIn
        product: GoogleSignInSwift
      - target: GastosDiariosWidget
      # Embeds the watchOS app so it installs alongside the phone app.
      - target: GastosDiariosWatch
        embed: true

  GastosDiariosWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: GastosDiariosWidget
      # The quick-entry App Intent is compiled into BOTH targets so the
      # iOS 18 Control can launch it (WIDGET_EXTENSION conditionals inside).
      - path: GastosDiarios/App/QuickEntryIntent.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.cardozo.gastosdiarios.widget
        PRODUCT_NAME: GastosDiariosWidget
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        SKIP_INSTALL: YES
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) WIDGET_EXTENSION"
    info:
      path: GastosDiariosWidget/Info.plist
      properties:
        CFBundleDisplayName: Gastos Diarios
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: GastosDiariosWidget/GastosDiariosWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.dev.cardozo.gastosdiarios

  # watchOS companion — a minimal quick-entry relay. It CANNOT sign in with
  # Google (no browser on the watch), so it never talks to Firebase: it sends
  # the expense to the phone via WatchConnectivity and the (authenticated)
  # phone performs the Firestore write. No Firebase dependency here on purpose.
  GastosDiariosWatch:
    type: application
    platform: watchOS
    deploymentTarget: "10.0"
    sources:
      - path: GastosDiariosWatch
      # Same shared seed categories bundled as a resource and decoded on-watch.
      - path: ../../shared/categories.json
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.cardozo.gastosdiarios.watchkitapp
        PRODUCT_NAME: GastosDiariosWatch
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "4"
        SKIP_INSTALL: YES
        GENERATE_INFOPLIST_FILE: NO
    info:
      path: GastosDiariosWatch/Info.plist
      properties:
        CFBundleDisplayName: Gastos Diarios
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # Modern single-target watchOS app paired to the iOS app.
        WKApplication: true
        WKCompanionAppBundleIdentifier: dev.cardozo.gastosdiarios

  # Compiles Core/ DIRECTLY instead of depending on the app target.
  #
  # The app embeds the watchOS app, so depending on it made `xcodebuild test`
  # require the watchOS platform to be installed — and when Xcode updated to
  # 26.6 that platform went missing and the whole test loop stopped for a
  # multi-gigabyte download. A unit test about parsing "90,12" has no business
  # needing a watch SDK.
  #
  # The cost is that a test touching something outside this list fails to
  # compile rather than failing an assertion. That is the trade: the list below
  # is the domain, and the domain is what these tests are about. Anything that
  # needs the app (SwiftUI views, AppModel) belongs in the app scheme.
  GastosDiariosTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: GastosDiariosTests
      - path: GastosDiarios/Core
      - path: GastosDiarios/Services/SigningExpiryService.swift
      # The strings L10n looks up. Compiled into the TEST bundle, which is why
      # L10n resolves its bundle through a type in its own module rather than
      # assuming Bundle.main.
      - path: GastosDiarios/Resources/Localizable.xcstrings
        buildPhase: resources
      # SeedCategories decodes this at runtime.
      - path: ../../shared/categories.json
        buildPhase: resources
      # Shared cross-platform test vectors (Swift + TS must both pass).
      - path: ../../shared/period-test-vectors.json
        buildPhase: resources
      - path: ../../shared/bank-match-vectors.json
        buildPhase: resources
    settings:
      base:
        # Test bundles have no Info.plist of their own; codesigning requires one.
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: dev.cardozo.gastosdiarios.tests
    dependencies:
      # Models.swift uses @DocumentID / @ServerTimestamp.
      - package: Firebase
        product: FirebaseFirestore

schemes:
  GastosDiarios:
    build:
      targets:
        GastosDiarios: all
        GastosDiariosTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: false
      targets:
        - GastosDiariosTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
  # Tests on their own, so the loop does not need the watchOS platform just
  # because the app scheme embeds a watch app. Use this one to run tests; the
  # GastosDiarios scheme is for running the app.
  GastosDiariosTests:
    build:
      targets:
        GastosDiariosTests: [test]
    test:
      config: Debug
      gatherCoverageData: false
      targets:
        - GastosDiariosTests
  GastosDiariosWatch:
    build:
      targets:
        GastosDiariosWatch: all
    run:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
